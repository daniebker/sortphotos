[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sortphotos"
dynamic = ["version"]
description = "Organize photos and other files into folders by date and/or time using EXIF data."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "S. Andrew Ning" }]
dependencies = ["ExifRead>=3.0"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Graphics",
    "Environment :: Console",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
sortphotos = "sortphotos.cli:main"

[tool.setuptools.dynamic]
version = { attr = "sortphotos.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PTH"]
ignore = ["PTH123"]  # open() is fine for binary reads

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["exifread", "exifread.*"]
ignore_missing_imports = true
